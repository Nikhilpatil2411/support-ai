name: CI/CD Pipeline

on:
  push:
    branches: [main, omdev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 final_app.py train_model.py --max-line-length=150 --ignore=E501,W503

      - name: Check model files exist
        run: |
          test -f model.pkl && echo "model.pkl found" || echo "model.pkl missing"
          test -f vectorizer.pkl && echo "vectorizer.pkl found" || echo "vectorizer.pkl missing"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t ai-support-platform:latest .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/omdev' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 (Auto)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to project folder or clone if first time
            cd /home/ec2-user/ai-support-platform || git clone https://github.com/${{ github.repository }} /home/ec2-user/ai-support-platform
            
            cd /home/ec2-user/ai-support-platform

            # Pull latest code from omdev
            git pull origin omdev

            # Stop old container (if exists)
            docker stop ai-container || true
            docker rm ai-container || true

            # Build new image
            docker build -t ai-support-platform .

            # Run new container
            docker run -d -p 80:3000 \
              --name ai-container \
              -e GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
              ai-support-platform