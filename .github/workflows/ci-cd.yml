name: CI/CD Pipeline

on:
  push:
    branches: [main, omdev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8 (ignore minor style errors)
        run: |
          pip install flake8
          flake8 final_app.py train_model.py --max-line-length=150 --ignore=E231,E302,E305,W391

      - name: Check model files exist
        run: |
          test -f model.pkl && echo "model.pkl found" || echo "model.pkl missing"
          test -f vectorizer.pkl && echo "vectorizer.pkl found" || echo "vectorizer.pkl missing"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t ai-support-platform:latest .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/omdev' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Deploying AI Support Platform to AWS EC2..."
          # Example: SSH deploy (adjust your user, IP, and key)
          # ssh -i /path/to/key.pem ec2-user@EC2_PUBLIC_IP \
          # "docker stop ai-container || true && docker rm ai-container || true && docker run -d -p 80:8501 --name ai-container ai-support-platform:latest"